name: Apply Identity Terraform
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY_IDENTITY_PRODUCTION to continue'
        required: true
        type: string
permissions:
  contents: read
  id-token: write

concurrency:
  group: identity-production-infrastructure
  cancel-in-progress: false

jobs:
  apply:
    if: inputs.confirmation == 'APPLY_IDENTITY_PRODUCTION'
    runs-on: ubuntu-24.04
    environment: identity-production
    env:
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
      TF_VAR_community_profile_projection_queue_arn: ${{ vars.COMMUNITY_PROFILE_PROJECTION_QUEUE_ARN }}
      TF_VAR_community_profile_projection_queue_url: ${{ vars.COMMUNITY_PROFILE_PROJECTION_QUEUE_URL }}
    defaults:
      run:
        working-directory: infra/terraform/environments/identity
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate GitHub production environment contract
        run: |
          bash ../../../scripts/validate-github-environment.sh terraform-apply identity "$AWS_APPLY_ROLE_ARN"
          bash ../../../scripts/validate-production-inputs.sh identity
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -lock-timeout=5m -out=tfplan
      - run: terraform apply -auto-approve tfplan
      - name: Verify Identity signing foundation
        run: |
          key_arn="$(terraform output -raw identity_jwt_signing_kms_key_arn)"
          test "$(aws kms describe-key --key-id "$key_arn" --query 'KeyMetadata.KeyState' --output text)" = "Enabled"
          echo "Identity signing key is enabled."
