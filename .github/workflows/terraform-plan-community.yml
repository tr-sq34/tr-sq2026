name: Plan Community Terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/environments/community/**'
      - '.github/workflows/terraform-plan-community.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: community-plan
    env:
      AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_VAR_identity_jwt_signing_kms_key_arn: ${{ vars.IDENTITY_JWT_SIGNING_KMS_KEY_ARN }}
    defaults:
      run:
        working-directory: infra/terraform/environments/community
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate GitHub plan environment contract
        run: |
          bash ../../../scripts/validate-github-environment.sh terraform-plan community "$AWS_PLAN_ROLE_ARN"
          bash ../../../scripts/validate-production-inputs.sh community
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: turksquare-community-plan-${{ github.run_id }}
          mask-aws-account-id: true
      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -lock-timeout=5m -no-color
