name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target AWS account environment
        required: true
        type: choice
        options: [identity, community, vault, backup]
      debug_oidc:
        description: Log non-sensitive OIDC claims before assuming the role
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment:
      # Apply environments are deliberately distinct from read-only plan
      # environments. Keep this mapping in sync with the plan-role StackSet
      # trust policy; selecting `community` must never mint a production token.
      name: ${{ inputs.target == 'community' && 'community-plan' || inputs.target == 'vault' && 'vault-plan' || inputs.target }}
    env:
      AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_VAR_identity_jwt_signing_kms_key_arn: ${{ vars.IDENTITY_JWT_SIGNING_KMS_KEY_ARN }}
      TF_VAR_community_capability_queue_arn: ${{ vars.COMMUNITY_CAPABILITY_QUEUE_ARN }}
      TF_VAR_community_capability_queue_url: ${{ vars.COMMUNITY_CAPABILITY_QUEUE_URL }}
    concurrency:
      group: terraform-plan-${{ inputs.target }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Validate GitHub plan environment contract
        run: |
          bash infra/scripts/validate-github-environment.sh terraform-plan "${{ inputs.target }}" "$AWS_PLAN_ROLE_ARN"
          case "${{ inputs.target }}" in
            community) bash infra/scripts/validate-production-inputs.sh community ;;
            vault) bash infra/scripts/validate-production-inputs.sh vault ;;
          esac

      - name: OIDC claim diagnostic
        if: ${{ inputs.debug_oidc }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(JSON.stringify({
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              environment: claims.environment,
            }, null, 2));

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          # All TurkSquare foundation accounts are intentionally pinned to
          # us-east-1. Keeping this in source avoids a missing/changed GitHub
          # Environment variable turning a read-only plan into a failed run.
          aws-region: us-east-1
          role-session-name: turksquare-terraform-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize backend
        working-directory: infra/terraform/environments/${{ inputs.target }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validate configuration
        working-directory: infra/terraform/environments/${{ inputs.target }}
        run: terraform validate -no-color

      - name: Create plan
        working-directory: infra/terraform/environments/${{ inputs.target }}
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
