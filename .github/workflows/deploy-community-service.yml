name: Deploy Community service

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_COMMUNITY_PRODUCTION to continue'
        required: true
        type: string
      start_service:
        description: 'Start one private service task after migration'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: community-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY_COMMUNITY_PRODUCTION'
    runs-on: ubuntu-24.04
    environment: community-production
    env:
      AWS_COMMUNITY_DEPLOY_ROLE_ARN: ${{ vars.AWS_COMMUNITY_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub deployment environment contract
        run: bash infra/scripts/validate-github-environment.sh service-deploy community "$AWS_COMMUNITY_DEPLOY_ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_COMMUNITY_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: turksquare-community-release-${{ github.run_id }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: turksquare/community-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --pull --tag "$image" services/community-service
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Render task definition
        run: aws ecs describe-task-definition --task-definition turksquare-community-service --query taskDefinition > task-definition.json
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: task_definition
        with:
          task-definition: task-definition.json
          container-name: community
          image: ${{ steps.image.outputs.uri }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        id: deploy_task_definition
        with:
          task-definition: ${{ steps.task_definition.outputs.task-definition }}
          service: turksquare-community
          cluster: turksquare-community
          wait-for-service-stability: false
      - name: Render migration task definition
        run: aws ecs describe-task-definition --task-definition turksquare-community-migration --query taskDefinition > migration-task-definition.json
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: migration_task_definition
        with:
          task-definition: migration-task-definition.json
          container-name: community-migration
          image: ${{ steps.image.outputs.uri }}
      - name: Register migration task definition
        id: deploy_migration_task_definition
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' '${{ steps.migration_task_definition.outputs.task-definition }}' > migration-task-definition-register.json
          arn=$(aws ecs register-task-definition --cli-input-json file://migration-task-definition-register.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-definition-arn=$arn" >> "$GITHUB_OUTPUT"
      - name: Run schema migrations exactly once
        shell: bash
        run: |
          set -euo pipefail
          network=$(aws ecs describe-services --cluster turksquare-community --services turksquare-community --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          subnets=$(jq -r '.subnets | join(",")' <<< "$network")
          security_groups=$(jq -r '.securityGroups | join(",")' <<< "$network")
          run_response=$(aws ecs run-task --cluster turksquare-community --launch-type FARGATE --task-definition '${{ steps.deploy_migration_task_definition.outputs.task-definition-arn }}' --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_groups],assignPublicIp=DISABLED}" --output json)
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<< "$run_response")
          if [[ -z "$task_arn" ]]; then
            echo "ECS could not start the migration task:" >&2
            jq '.failures' <<< "$run_response" >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster turksquare-community --tasks "$task_arn"
          task=$(aws ecs describe-tasks --cluster turksquare-community --tasks "$task_arn" --query 'tasks[0]' --output json)
          exit_code=$(jq -r '.containers[] | select(.name == "community-migration") | .exitCode // empty' <<< "$task")
          if [[ "$exit_code" != "0" ]]; then
            echo "Community migration task failed:" >&2
            jq '{StoppedReason: .stoppedReason, StopCode: .stopCode, Container: (.containers[] | select(.name == "community-migration") | {reason,exitCode,lastStatus})}' <<< "$task" >&2
            # ECS does not consistently return logStreamName for a stopped
            # Fargate task.  The awslogs driver stream name is deterministic,
            # so derive a safe fallback from the task ARN to preserve the
            # actual database failure in this protected deployment log.
            task_id="${task_arn##*/}"
            log_stream=$(jq -r '.containers[] | select(.name == "community-migration") | .logStreamName // empty' <<< "$task")
            log_stream="${log_stream:-community-migration/community-migration/$task_id}"
            echo "Migration log stream: $log_stream" >&2
            for attempt in {1..6}; do
              log_events=$(aws logs filter-log-events --log-group-name /turksquare/community-service --log-stream-names "$log_stream" --limit 50 --query 'events[*].message' --output text 2>/dev/null || true)
              if [[ -n "$log_events" && "$log_events" != "None" ]]; then
                printf '%s\n' "$log_events" >&2
                break
              fi
              sleep 5
            done
            exit 1
          fi
      - name: Render profile projection worker task definition
        run: aws ecs describe-task-definition --task-definition turksquare-community-profile-projection-worker --query taskDefinition > projection-worker-task-definition.json
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: projection_worker_task_definition
        with:
          task-definition: projection-worker-task-definition.json
          container-name: profile-projection-worker
          image: ${{ steps.image.outputs.uri }}
      - name: Register profile projection worker task definition
        id: deploy_projection_worker_task_definition
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' '${{ steps.projection_worker_task_definition.outputs.task-definition }}' > projection-worker-task-definition-register.json
          arn=$(aws ecs register-task-definition --cli-input-json file://projection-worker-task-definition-register.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-definition-arn=$arn" >> "$GITHUB_OUTPUT"
      - name: Render media processor task definition
        run: aws ecs describe-task-definition --task-definition turksquare-community-media-processor --query taskDefinition > media-processor-task-definition.json
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: media_processor_task_definition
        with:
          task-definition: media-processor-task-definition.json
          container-name: media-processor
          image: ${{ steps.image.outputs.uri }}
      - name: Register media processor task definition
        id: deploy_media_processor_task_definition
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' '${{ steps.media_processor_task_definition.outputs.task-definition }}' > media-processor-task-definition-register.json
          arn=$(aws ecs register-task-definition --cli-input-json file://media-processor-task-definition-register.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-definition-arn=$arn" >> "$GITHUB_OUTPUT"
      - name: Start service only after migration success
        if: inputs.start_service
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service --cluster turksquare-community --service turksquare-community --desired-count 1 --force-new-deployment >/dev/null
          aws ecs update-service --cluster turksquare-community --service turksquare-community-profile-projection-worker --task-definition '${{ steps.deploy_projection_worker_task_definition.outputs.task-definition-arn }}' --desired-count 1 --force-new-deployment >/dev/null
          aws ecs update-service --cluster turksquare-community --service turksquare-community-media-processor --task-definition '${{ steps.deploy_media_processor_task_definition.outputs.task-definition-arn }}' --desired-count 1 --force-new-deployment >/dev/null

          # Verify the Fargate task through its container health check. This
          # check calls /health and also confirms the private RDS path without
          # relying on the public edge.
          for attempt in {1..24}; do
            task_arn=$(aws ecs list-tasks --cluster turksquare-community --service-name turksquare-community --desired-status RUNNING --query 'taskArns[0]' --output text)
            if [[ -n "$task_arn" && "$task_arn" != "None" ]]; then
              health=$(aws ecs describe-tasks --cluster turksquare-community --tasks "$task_arn" --query 'tasks[0].containers[?name==`community`].healthStatus | [0]' --output text)
              last_status=$(aws ecs describe-tasks --cluster turksquare-community --tasks "$task_arn" --query 'tasks[0].lastStatus' --output text)
              if [[ "$health" == "HEALTHY" ]]; then
                echo "Private Community API health check passed."
                exit 0
              fi
              if [[ "$last_status" == "STOPPED" || "$health" == "UNHEALTHY" ]]; then
                aws ecs describe-tasks --cluster turksquare-community --tasks "$task_arn" --query 'tasks[0].{StoppedReason:stoppedReason,ContainerReason:containers[?name==`community`].reason|[0],ExitCode:containers[?name==`community`].exitCode|[0]}' --output json
                exit 1
              fi
            fi
            sleep 15
          done

          echo "Timed out waiting for the private Community API health check."
          exit 1
      - name: Verify profile projection worker is running
        if: inputs.start_service
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            task_arn=$(aws ecs list-tasks --cluster turksquare-community --service-name turksquare-community-profile-projection-worker --desired-status RUNNING --query 'taskArns[0]' --output text)
            if [[ -n "$task_arn" && "$task_arn" != "None" ]]; then
              echo "Profile projection worker is running."
              exit 0
            fi
            sleep 10
          done
          echo "Profile projection worker did not reach RUNNING state." >&2
          exit 1
      - name: Verify media processor is running
        if: inputs.start_service
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            task_arn=$(aws ecs list-tasks --cluster turksquare-community --service-name turksquare-community-media-processor --desired-status RUNNING --query 'taskArns[0]' --output text)
            if [[ -n "$task_arn" && "$task_arn" != "None" ]]; then
              echo "Media processor is running."
              exit 0
            fi
            sleep 10
          done
          echo "Media processor did not reach RUNNING state." >&2
          exit 1
