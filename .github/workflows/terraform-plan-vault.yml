name: Plan Verification Vault Terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/environments/vault/**'
      - '.github/workflows/terraform-plan-vault.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: vault-plan
    env:
      AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_VAR_identity_jwt_signing_kms_key_arn: ${{ vars.IDENTITY_JWT_SIGNING_KMS_KEY_ARN }}
      TF_VAR_community_capability_queue_arn: ${{ vars.COMMUNITY_CAPABILITY_QUEUE_ARN }}
      TF_VAR_community_capability_queue_url: ${{ vars.COMMUNITY_CAPABILITY_QUEUE_URL }}
    defaults:
      run:
        working-directory: infra/terraform/environments/vault
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate GitHub plan environment contract
        run: |
          bash ../../../scripts/validate-github-environment.sh terraform-plan vault "$AWS_PLAN_ROLE_ARN"
          bash ../../../scripts/validate-production-inputs.sh vault
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: turksquare-vault-plan-${{ github.run_id }}
          mask-aws-account-id: true
      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -lock-timeout=5m -no-color
