name: Apply Community Terraform

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY_COMMUNITY_PRODUCTION to continue'
        required: true
        type: string
      migrate_legacy_secret_state:
        description: 'Remove the known legacy runtime-secret records from Terraform state before planning'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: community-production-infrastructure
  cancel-in-progress: false

jobs:
  apply:
    if: inputs.confirmation == 'APPLY_COMMUNITY_PRODUCTION'
    runs-on: ubuntu-24.04
    environment: community-production
    env:
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
      TF_VAR_identity_jwt_signing_kms_key_arn: ${{ vars.IDENTITY_JWT_SIGNING_KMS_KEY_ARN }}
    defaults:
      run:
        working-directory: infra/terraform/environments/community
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate GitHub production environment contract
        run: |
          bash ../../../scripts/validate-github-environment.sh terraform-apply community "$AWS_APPLY_ROLE_ARN"
          bash ../../../scripts/validate-production-inputs.sh community
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: turksquare-community-apply-${{ github.run_id }}
          mask-aws-account-id: true
      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - name: Remove legacy runtime-secret records from state
        if: inputs.migrate_legacy_secret_state
        shell: bash
        run: |
          set -euo pipefail
          addresses=(
            'aws_secretsmanager_secret_version.community_service_config'
            'aws_secretsmanager_secret.community_service_config'
            'random_password.community_internal_token'
          )

          state_addresses="$(terraform state list)"
          for address in "${addresses[@]}"; do
            if grep -Fqx "$address" <<<"$state_addresses"; then
              echo "Removing legacy state record: $address"
              terraform state rm -lock-timeout=5m "$address"
            else
              echo "Legacy state record already absent: $address"
            fi
          done
      - run: terraform plan -lock-timeout=5m -out=tfplan
      - run: terraform apply -auto-approve tfplan
