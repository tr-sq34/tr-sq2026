name: Apply Community Terraform

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY_COMMUNITY_PRODUCTION to continue'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: community-production-infrastructure
  cancel-in-progress: false

jobs:
  apply:
    if: inputs.confirmation == 'APPLY_COMMUNITY_PRODUCTION'
    runs-on: ubuntu-24.04
    environment: community-production
    env:
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
      TF_VAR_identity_jwt_signing_kms_key_arn: ${{ vars.IDENTITY_JWT_SIGNING_KMS_KEY_ARN }}
    defaults:
      run:
        working-directory: infra/terraform/environments/community
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate GitHub production environment contract
        run: |
          bash ../../../scripts/validate-github-environment.sh terraform-apply community "$AWS_APPLY_ROLE_ARN"
          bash ../../../scripts/validate-production-inputs.sh community
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: turksquare-community-apply-${{ github.run_id }}
          mask-aws-account-id: true
      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -lock-timeout=5m -out=tfplan
      - run: terraform apply -auto-approve tfplan
