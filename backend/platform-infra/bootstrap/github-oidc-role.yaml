AWSTemplateFormatVersion: '2010-09-09'
Description: TurkSquare GitHub Actions OIDC trust bootstrap. Deploy as StackSet to each workload account.
Parameters:
  RoleName: { Type: String, Default: GitHubActionsTerraformPlanRole }
  GitHubRepository: { Type: String, Default: trsq34/tr-sq2026 }
  Branch: { Type: String, Default: main }
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
  TerraformPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: { 'token.actions.githubusercontent.com:aud': sts.amazonaws.com }
              StringLike: { 'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepository}:ref:refs/heads/${Branch}' }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
Outputs:
  RoleArn: { Value: !GetAtt TerraformPlanRole.Arn }
