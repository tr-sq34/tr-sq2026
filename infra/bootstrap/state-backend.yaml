AWSTemplateFormatVersion: '2010-09-09'
Description: TurkSquare Terraform remote-state bootstrap. Deploy once in the Management account.

Parameters:
  StateBucketName:
    Type: String
    Default: turksquare-terraform-state-626300432889
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  KmsAlias:
    Type: String
    Default: alias/turksquare-terraform-state

Resources:
  StateKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts TurkSquare Terraform state.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountRootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  StateKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Ref KmsAlias
      TargetKeyId: !Ref StateKey

  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref StateBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt StateKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  StateLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: turksquare-terraform-lock
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt StateKey.Arn
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH

Outputs:
  StateBucket:
    Value: !Ref StateBucket
  LockTable:
    Value: !Ref StateLockTable
  KmsKeyArn:
    Value: !GetAtt StateKey.Arn
