AWSTemplateFormatVersion: '2010-09-09'
Description: TurkSquare GitHub Actions OIDC read-only Terraform plan role. Deploy as a StackSet to workload accounts.

Parameters:
  RoleName:
    Type: String
    Default: GitHubActionsTerraformPlanRole
  GitHubRepository:
    Type: String
    Default: tr-sq34/tr-sq2026
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubEnvironment:
    Type: String
    Default: identity
    AllowedValues: [identity, community, vault, backup]
  StateAccessAccountId:
    Type: String
    Default: '626300432889'
    AllowedPattern: '^[0-9]{12}$'

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  TerraformPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustGitHubActionsEnvironmentOnly
            Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringEquals:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:${GitHubEnvironment}'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: AllowAssumeScopedTerraformStateRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${StateAccessAccountId}:role/TerraformStateAccess*'

Outputs:
  RoleArn:
    Value: !GetAtt TerraformPlanRole.Arn
